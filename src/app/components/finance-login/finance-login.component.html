<main>
  <mat-card class="auth-card">
    <mat-card-header class="auth-header">
      <mat-card-title class="auth-title">PRIVATE ACCESS</mat-card-title>
      <mat-card-subtitle class="auth-subtitle">Enter your credentials to view the finance dashboard</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form class="auth-form" (ngSubmit)="submit()">
        <mat-form-field>
          <mat-label>Username</mat-label>
          <input matInput [formControl]="username" autocomplete="username" required>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Password</mat-label>
          <input matInput type="password" [formControl]="password" autocomplete="current-password" required>
        </mat-form-field>

        <p class="auth-error" *ngIf="loginFailed">Invalid username or password.</p>

        <mat-card-actions>
          <button class="app-button" type="submit" [disabled]="isFormInvalid() || isLoading">LOGIN</button>
        </mat-card-actions>
      </form>
    </mat-card-content>
  </mat-card>

  <div class="loading-spinner" *ngIf="isLoading">
    <mat-spinner diameter="50"></mat-spinner>
  </div>
</main>
